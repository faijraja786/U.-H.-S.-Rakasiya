services:
  - type: web
    name: edufuture-api
    runtime: node
    plan: free
    region: singapore
    rootDir: functions
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
