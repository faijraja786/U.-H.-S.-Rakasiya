<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#312e81">
  <meta name="description" content="EduFuture - U.H.S. Rakasiya Smart Learning Portal">
  <title>EduFuture | U.H.S. Rakasiya</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section id="auth" class="auth-card">
    <div class="brand-mark">EF</div>
    <h1>EduFuture</h1>
    <p class="muted center">U.H.S. Rakasiya • Smart Learning Portal</p>
    <label for="loginRole">Login Type</label>
    <select id="loginRole">
      <option value="student">Student Login</option>
      <option value="admin">Admin Login</option>
      <option value="superadmin">Super Admin Login</option>
    </select>
    <label for="name">Full Name (नए Student account के लिए)</label>
    <input id="name" type="text" autocomplete="name" placeholder="अपना पूरा नाम">
    <label for="email">Email Address</label>
    <input id="email" type="email" autocomplete="username" placeholder="name@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="login" class="primary full">Login</button>
    <button id="signup" class="secondary full">Create Student Account</button>
    <button id="google" class="google full">Continue with Google</button>
    <button id="reset" class="text-button full">Forgot Password?</button>
    <p id="authMessage" role="status" aria-live="polite"></p>
    <p class="muted center small">Learn Today • Lead Tomorrow</p>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div>
        <div class="brand-title">EduFuture</div>
        <div class="muted-light">U.H.S. Rakasiya</div>
      </div>
      <div class="account">
        <span id="roleBadge" class="role-badge"></span>
        <span id="identity"></span>
        <button id="logout" class="danger">Logout</button>
      </div>
    </header>
    <nav id="nav" class="nav"></nav>
    <main id="view" class="content"></main>
    <footer>© 2026 EduFuture • U.H.S. Rakasiya</footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
