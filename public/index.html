<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduFuture | U.H.S. Rakasiya</title>

<meta name="theme-color" content="#4f46e5">
<meta name="description" content="EduFuture - Smart Learning and Online Examination Platform">

<link rel="stylesheet" href="./style.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5ff;
  color: #172554;
}

header {
  background: linear-gradient(120deg,#312e81,#4f46e5,#7c3aed);
  color: white;
  padding: 25px 18px;
  border-radius: 0 0 25px 25px;
  box-shadow: 0 5px 20px #312e8133;
}

header h1 {
  font-size: 30px;
}

header p {
  margin-top: 7px;
}

#auth {
  max-width: 430px;
  margin: 50px auto;
  padding: 25px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 8px 35px #64748b30;
}

#auth h1 {
  color: #4f46e5;
  text-align: center;
  font-size: 32px;
}

#auth h2 {
  text-align: center;
  margin: 15px 0;
  font-size: 19px;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 15px;
  background: #f8fafc;
}

button {
  padding: 11px 16px;
  border: none;
  border-radius: 10px;
  background: #4f46e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin: 5px 3px;
}

button:hover {
  background: #3730a3;
}

#auth button {
  width: 100%;
  padding: 13px;
}

#google {
  background: #0f9d58;
}

#reset {
  background: #64748b;
}

#message {
  color: #dc2626;
  margin-top: 12px;
  text-align: center;
}

#app {
  padding: 15px;
}

#logout {
  background: #ef4444;
}

#nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 15px 0;
}

#nav button {
  white-space: nowrap;
  background: white;
  color: #4338ca;
  border: 1px solid #c7d2fe;
}

#nav button.active {
  background: #4f46e5;
  color: white;
}

.panel {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin: 12px 0;
  box-shadow: 0 5px 20px #64748b18;
}

.panel h2 {
  color: #4338ca;
  margin-bottom: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
  gap: 12px;
  margin: 15px 0;
}

.item {
  background: linear-gradient(135deg,#eef2ff,#f5f3ff);
  padding: 16px;
  margin: 10px 0;
  border-radius: 13px;
  border: 1px solid #ddd6fe;
}

.item h2 {
  color: #4f46e5;
}

.question {
  background: #f8fafc;
  padding: 15px;
  border-radius: 12px;
  margin: 15px 0;
  border: 1px solid #e2e8f0;
}

.option {
  display: block;
  padding: 10px;
  margin: 7px 0;
  background: white;
  border-radius: 8px;
}

.option input {
  width: auto;
}

details {
  margin-top: 10px;
}

a {
  color: #4f46e5;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px;
  color: #64748b;
}

[hidden] {
  display: none !important;
}

@media(max-width:600px) {
  header h1 {
    font-size: 25px;
  }

  #app {
    padding: 10px;
  }

  .panel {
    padding: 15px;
  }
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<div id="auth">

  <h1>🎓 EduFuture</h1>
  <h2>Welcome to Smart Learning</h2>

  <p style="text-align:center;color:#64748b;margin-bottom:15px">
    U.H.S. Rakasiya
  </p>

  <input id="name" type="text" placeholder="Your Full Name">

  <input id="email" type="email" placeholder="Email Address">

  <input id="password" type="password" placeholder="Password">

  <button id="signup">✨ Create Account</button>

  <button id="login">🔐 Login</button>

  <button id="google">🌐 Google Login</button>

  <button id="reset">Forgot Password?</button>

  <p id="message"></p>

  <p style="text-align:center;margin-top:20px;color:#64748b">
    Learn Today • Lead Tomorrow
  </p>

</div>

<!-- MAIN DASHBOARD -->
<div id="app" hidden>

  <header>
    <h1>🎓 EduFuture</h1>
    <p>U.H.S. Rakasiya | Smart Education Portal</p>
    <p id="identity"></p>
    <button id="logout">Logout ↗</button>
  </header>

  <nav id="nav"></nav>

  <main id="view"></main>

  <footer>
    <h3>EduFuture</h3>
    <p>Empowering Students Through Education</p>
    <p>© 2026 U.H.S. Rakasiya</p>
  </footer>

</div>

<script type="module" src="./app.js"></script>

</body>
    </html>
